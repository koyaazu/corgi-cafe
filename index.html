<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOBE CORGI CAFE | 愛犬と過ごす神戸の港町カフェ</title>
  <style>
    /* ==========================================
       1. サイト全体の背景（ゆらゆら動くマーブル波模様）
    ========================================== */
    body {
      margin: 0;
      padding: 0;
      /* 神戸の海と波打ち際をイメージしたグラデーション */
      background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #f0f9ff, #ffffff);
      background-size: 400% 400%;
      /* 15秒かけて背景がマーブル状となめらかに動く */
      animation: waveGradient 15s ease infinite;
      font-family: "Helvetica Neue", Arial, "ヒラギノ角ゴ Pro W3", sans-serif;
      color: #333333;
    }

    @keyframes waveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ==========================================
       2. ナビゲーションヘッダー
    ========================================== */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(0, 102, 204, 0.05);
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1e3a8a;
      text-decoration: none;
    }

    .global-nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 20px;
    }

    .global-nav a {
      text-decoration: none;
      color: #1e3a8a;
      font-weight: 500;
      transition: color 0.3s;
    }

    .global-nav a:hover {
      color: #0284c7;
    }

    /* ==========================================
       3. メインビジュアル（シャッターフラッシュ演出）
    ========================================== */
    .hero-container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .top-hero-photo {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 102, 204, 0.15);
      aspect-ratio: 16 / 9;
      max-height: 450px;
      background-color: #cbd5e1; /* 画像読み込み前のアタリ */
    }

    .top-hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    /* ホバー時に写真が少し浮かび上がる */
    .top-hero-photo:hover img {
      transform: scale(1.02);
    }

    /* フラッシュ（光）のエフェクト */
    .top-hero-photo::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      pointer-events: none;
    }

    .top-hero-photo:hover::after {
      animation: shutterFlash 0.75s ease-out;
    }

    @keyframes shutterFlash {
      100% { left: 200%; }
    }

    .hero-title-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #ffffff;
      text-shadow: 1px 1px 8px rgba(0,0,0,0.6);
    }

    .hero-title-overlay h1 {
      margin: 0;
      font-size: 2rem;
    }

    /* ==========================================
       4. 白い薄型レイヤー（グラスモーフィズムカード）
    ========================================== */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 30px;
      margin: 30px auto;
      max-width: 900px;
      box-shadow: 0 8px 32px rgba(0, 102, 204, 0.08);
    }

    /* ==========================================
       5. タイトルの「黒肉球の足跡」演出
    ========================================== */
    .paw-title {
      position: relative;
      display: inline-block;
      padding-left: 45px;
      font-size: 1.6rem;
      color: #1e3a8a;
      margin-top: 0;
    }

    .paw-title::before {
      content: '🐾';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) rotate(-15deg);
      font-size: 1.4rem;
      opacity: 0.85;
      animation: pawStep 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pawStep {
      0% { transform: translateY(-50%) scale(0) rotate(-45deg); opacity: 0; }
      100% { transform: translateY(-50%) scale(1) rotate(-15deg); opacity: 0.85; }
    }

    /* レスポンシブ調整（スマホ対応） */
    @media screen and (max-width: 768px) {
      .nav-container { flex-direction: column; gap: 10px; }
      .hero-title-overlay h1 { font-size: 1.4rem; }
      .paw-title { font-size: 1.3rem; }
      .glass-card { margin: 15px; padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- ナビゲーション（TOPと子ページを繋ぐリンク） -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">KOBE CORGI CAFE</a>
      <nav class="global-nav">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="dogs.html">看板犬について</a></li>
          <li><a href="news.html">お知らせ</a></li>
          <li><a href="access.html">アクセス</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- TOP メインビジュアル（シャッター演出画像） -->
  <div class="hero-container">
    <div class="top-hero-photo">
      <!-- ★ご自身の画像のファイル名・パスに打ち替えてください -->
      <img src="images/top-hero.jpg" alt="神戸の海と愛犬">
      <div class="hero-title-overlay">
        <h1>波打ち際で、愛犬と特別なひとときを。</h1>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ（すりガラス風カード） -->
  <main>
    <section class="glass-card">
      <h2 class="paw-title">Concept</h2>
      <p>潮風が心地よい港町・神戸に広がる、コーギーと愛犬家のための小さな隠れ家カフェ。</p>
      <p>寿々彦とナナと一緒に、波音を聞きながら思い出の一ページを残しませんか？</p>
    </section>

    <section class="glass-card">
      <h2 class="paw-title">News & Topics</h2>
      <p>【お知らせ】看板犬・寿々彦の出勤スケジュールを更新しました！</p>
    </section>
  </main>

</body>
</html>
